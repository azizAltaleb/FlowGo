    build: !reset null

  frontend:
    image: ${ARTIFICIALFLOW_IMAGE_REGISTRY:-${FLOWGO_IMAGE_REGISTRY:-artificialflow}}/frontend:${ARTIFICIALFLOW_IMAGE_TAG:-${FLOWGO_IMAGE_TAG:-0.3.0}}
    build: !reset null

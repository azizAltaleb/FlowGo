openapi: 3.0.3
info:
  title: ArtificialFlow HTTP API
  version: 1.1.0
  description: |
    Supported HTTP contract for ArtificialFlow command, query, worker, inbox,
    and bundled-IAM integrations. The gateway `/api` URL is the public base.
    Query operations under `/query` are eventually consistent.
  license:
    name: MIT
    url: https://opensource.org/license/mit
  contact:
    name: ArtificialFlow
    url: https://github.com/artificialflow/artificialflow
servers:
  - url: http://localhost:9100/api
    description: Local Compose gateway
  - url: https://app.example.com/api
    description: Production gateway example
tags:
  - name: Identity
    description: Principal inspection and deployment IAM metadata
  - name: Workflows
    description: BPMN process-definition deployment and management
  - name: Decisions
    description: JSON decision-table deployment and evaluation
  - name: Instances
    description: Authoritative workflow-instance commands and reads
  - name: Events
    description: BPMN message, signal, and escalation publication
  - name: Jobs
    description: External worker activation, locking, completion, and failure
  - name: Inbox
    description: Human-task BFF and acting-user operations
  - name: Query
    description: Eventually consistent projected search operations
  - name: Operations
    description: Health, incidents, retries, and engine counters
  - name: IAM administration
    description: Bundled-ZITADEL administration for trusted admin automation
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Operations]
      summary: Check command service health
      operationId: commandHealth
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /identity/me:
    get:
      tags: [Identity]
      summary: Inspect the authenticated principal
      operationId: getIdentity
      responses:
        "200":
          description: Authentication state and principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /identity/config:
    get:
      tags: [Identity]
      summary: Read non-secret IAM deployment configuration
      operationId: getIdentityConfig
      responses:
        "200":
          description: IAM mode, issuers, claim paths, and standard roles
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /workflows:
    get:
      tags: [Workflows]
      summary: List authoritative workflow definitions
      operationId: listWorkflows
      responses:
        "200":
          description: Workflow definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowDefinition"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Workflows]
      summary: Deploy a BPMN 2.0 workflow
      operationId: deployWorkflow
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
              format: binary
          text/xml:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Deployed definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: BPMN exceeds the 20 MiB request limit
  /workflows/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
    get:
      tags: [Workflows]
      summary: Get a workflow definition by key or BPMN process id
      operationId: getWorkflow
      responses:
        "200":
          description: Workflow definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinition"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Workflows]
      summary: Delete a workflow definition
      operationId: deleteWorkflow
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /decisions:
    get:
      tags: [Decisions]
      summary: List deployed decisions
      operationId: listDecisions
      responses:
        "200":
          description: Decisions
          content:
            application/json:
              schema:
                type: object
                properties:
                  decisions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Decision"
    post:
      tags: [Decisions]
      summary: Deploy a JSON decision table
      operationId: deployDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployDecisionRequest"
      responses:
        "200":
          description: Deployed decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        "400":
          $ref: "#/components/responses/BadRequest"
  /decisions/{id}/evaluate:
    post:
      tags: [Decisions]
      summary: Evaluate the latest version of a decision
      operationId: evaluateDecision
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Decision outputs
          content:
            application/json:
              schema:
                type: object
                properties:
                  outputs:
                    type: object
                    additionalProperties: true
        "404":
          $ref: "#/components/responses/NotFound"
  /instances:
    get:
      tags: [Instances]
      summary: List active instances from the command store
      operationId: listInstances
      responses:
        "200":
          description: Active instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowInstance"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Instances]
      summary: Start a workflow instance
      operationId: startInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartInstanceRequest"
      responses:
        "200":
          description: Started instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances/history/completed:
    get:
      tags: [Instances]
      summary: List completed instance history
      operationId: listCompletedInstances
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Completed instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowInstance"
  /instances/{id}:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    get:
      tags: [Instances]
      summary: Get authoritative instance details
      operationId: getInstance
      responses:
        "200":
          description: Instance, executions, and task metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstance"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Instances]
      summary: Cancel and delete an instance
      operationId: deleteInstance
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
  /instances/{id}/variables:
    post:
      tags: [Instances]
      summary: Merge variables into an instance
      operationId: updateInstanceVariables
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variables]
              properties:
                variables:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Updated instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstance"
  /instances/{id}/complete:
    post:
      tags: [Instances]
      summary: Complete an instance step by BPMN step id
      operationId: completeInstanceStep
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step_id]
              properties:
                step_id:
                  type: string
      responses:
        "200":
          description: Step completed
        "400":
          $ref: "#/components/responses/BadRequest"
  /instances/{id}/tasks:
    get:
      tags: [Instances]
      summary: List user tasks for an instance
      operationId: listInstanceTasks
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/IncludeCompleted"
      responses:
        "200":
          description: User tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTaskList"
  /instances/{id}/tasks/{executionId}/claim:
    post:
      tags: [Instances]
      summary: Administratively claim a user task
      operationId: adminClaimTask
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/ExecutionId"
      responses:
        "200":
          description: Claimed task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTask"
  /instances/{id}/tasks/{executionId}/complete:
    post:
      tags: [Instances]
      summary: Administratively complete a user task
      operationId: adminCompleteTask
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/ExecutionId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                variables:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Completed task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTask"
  /instances/{id}/jobs:
    get:
      tags: [Jobs]
      summary: List jobs belonging to an instance
      operationId: listInstanceJobs
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
  /signals:
    post:
      tags: [Events]
      summary: Publish a BPMN signal
      operationId: publishSignal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignalRequest"
      responses:
        "200":
          description: Published
  /messages:
    post:
      tags: [Events]
      summary: Correlate and publish a BPMN message
      operationId: publishMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
      responses:
        "200":
          description: Published
  /escalations:
    post:
      tags: [Events]
      summary: Publish a BPMN escalation
      operationId: publishEscalation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalationRequest"
      responses:
        "200":
          description: Published
  /jobs/capabilities:
    get:
      tags: [Jobs]
      summary: Read worker protocol capabilities
      operationId: getJobCapabilities
      parameters:
        - $ref: "#/components/parameters/WorkerProtocol"
      responses:
        "200":
          description: Supported protocol and operations
          headers:
            X-Workflow-Engine-Protocol-Version:
              schema:
                type: string
                example: v1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCapabilities"
  /jobs/activate:
    post:
      tags: [Jobs]
      summary: Activate and lock available jobs
      operationId: activateJobs
      parameters:
        - $ref: "#/components/parameters/WorkerProtocol"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateJobsRequest"
      responses:
        "200":
          description: Activated jobs
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
  /jobs/{key}/complete:
    post:
      tags: [Jobs]
      summary: Complete an activated job
      operationId: completeJob
      parameters:
        - $ref: "#/components/parameters/JobKey"
        - $ref: "#/components/parameters/WorkerProtocol"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteJobRequest"
      responses:
        "200":
          description: Completed or safely replayed
        "409":
          $ref: "#/components/responses/Conflict"
  /jobs/{key}/fail:
    post:
      tags: [Jobs]
      summary: Fail an activated job
      operationId: failJob
      parameters:
        - $ref: "#/components/parameters/JobKey"
        - $ref: "#/components/parameters/WorkerProtocol"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailJobRequest"
      responses:
        "200":
          description: Failed or safely replayed
  /jobs/{key}/extend-lock:
    post:
      tags: [Jobs]
      summary: Extend an activated job lock
      operationId: extendJobLock
      parameters:
        - $ref: "#/components/parameters/JobKey"
        - $ref: "#/components/parameters/WorkerProtocol"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtendJobLockRequest"
      responses:
        "200":
          description: Lock extended or safely replayed
  /jobs/{key}/retry:
    post:
      tags: [Jobs]
      summary: Administratively retry a failed job
      operationId: retryJob
      parameters:
        - $ref: "#/components/parameters/JobKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                retries:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: Job scheduled for retry
  /incidents:
    get:
      tags: [Operations]
      summary: List incidents
      operationId: listIncidents
      parameters:
        - name: processInstanceKey
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"
  /internal/metrics:
    get:
      tags: [Operations]
      summary: Read engine operational counters
      operationId: getEngineMetrics
      responses:
        "200":
          description: Outbox and idempotency metrics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /inbox:
    get:
      tags: [Inbox]
      summary: List active instances visible to the acting user
      operationId: listInbox
      parameters:
        - $ref: "#/components/parameters/ActingSubject"
        - $ref: "#/components/parameters/ActingUsername"
        - $ref: "#/components/parameters/ActingEmail"
        - $ref: "#/components/parameters/ActingName"
        - $ref: "#/components/parameters/ActingRoles"
      responses:
        "200":
          description: Visible instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowInstance"
        "403":
          $ref: "#/components/responses/Forbidden"
  /inbox/history:
    get:
      tags: [Inbox]
      summary: List completed history visible to the acting user
      operationId: listInboxHistory
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/ActingSubject"
        - $ref: "#/components/parameters/ActingUsername"
        - $ref: "#/components/parameters/ActingEmail"
        - $ref: "#/components/parameters/ActingRoles"
      responses:
        "200":
          description: Completed instances
  /inbox/instances/{id}:
    get:
      tags: [Inbox]
      summary: Get an inbox instance and task metadata
      operationId: getInboxInstance
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/IncludeCompleted"
        - $ref: "#/components/parameters/ActingSubject"
        - $ref: "#/components/parameters/ActingUsername"
        - $ref: "#/components/parameters/ActingEmail"
        - $ref: "#/components/parameters/ActingRoles"
      responses:
        "200":
          description: Inbox instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstance"
  /inbox/instances/{id}/tasks:
    get:
      tags: [Inbox]
      summary: List inbox tasks for an instance
      operationId: listInboxTasks
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/IncludeCompleted"
        - $ref: "#/components/parameters/ActingSubject"
        - $ref: "#/components/parameters/ActingUsername"
        - $ref: "#/components/parameters/ActingEmail"
        - $ref: "#/components/parameters/ActingRoles"
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTaskList"
  /inbox/instances/{id}/tasks/{executionId}/claim:
    post:
      tags: [Inbox]
      summary: Claim a task as the acting user
      operationId: claimInboxTask
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/ExecutionId"
        - $ref: "#/components/parameters/ActingSubject"
        - $ref: "#/components/parameters/ActingUsername"
        - $ref: "#/components/parameters/ActingEmail"
        - $ref: "#/components/parameters/ActingRoles"
      responses:
        "200":
          description: Claimed task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTask"
        "409":
          $ref: "#/components/responses/Conflict"
  /inbox/instances/{id}/tasks/{executionId}/complete:
    post:
      tags: [Inbox]
      summary: Complete a claimed task as the acting user
      operationId: completeInboxTask
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/ExecutionId"
        - $ref: "#/components/parameters/ActingSubject"
        - $ref: "#/components/parameters/ActingUsername"
        - $ref: "#/components/parameters/ActingEmail"
        - $ref: "#/components/parameters/ActingRoles"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                variables:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Completed task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTask"
  /query/health:
    get:
      tags: [Query]
      summary: Check query service health
      operationId: queryHealth
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /query/identity/me:
    get:
      tags: [Query, Identity]
      summary: Inspect the query-service principal
      operationId: getQueryIdentity
      responses:
        "200":
          description: Authentication state and principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResponse"
  /query/instances:
    get:
      tags: [Query]
      summary: Search projected workflow instances
      description: Results are eventually consistent with command writes.
      operationId: searchInstances
      parameters:
        - name: workflowId
          in: query
          schema:
            type: string
          description: Numeric process-definition key
        - name: state
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Projected instances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectedInstancePage"
  /query/instances/{id}:
    get:
      tags: [Query]
      summary: Get a projected instance
      operationId: getProjectedInstance
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "200":
          description: Projected instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstance"
        "404":
          $ref: "#/components/responses/NotFound"
  /query/workflows:
    get:
      tags: [Query]
      summary: Search projected workflow definitions
      operationId: searchWorkflows
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Projected workflows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectedWorkflowPage"
  /identity/management/clients:
    get:
      tags: [IAM administration]
      summary: List bundled-IAM machine clients
      operationId: listIamClients
      responses:
        "200":
          description: Machine clients
    post:
      tags: [IAM administration]
      summary: Create a bundled-IAM machine client
      operationId: createIamClient
      responses:
        "200":
          description: Client and one-time credential/profile
  /identity/management/clients/{id}:
    delete:
      tags: [IAM administration]
      summary: Delete a bundled-IAM machine client
      operationId: deleteIamClient
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Deleted
  /identity/management/clients/{id}/tokens:
    post:
      tags: [IAM administration]
      summary: Rotate or create a client token
      operationId: rotateIamClientToken
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: One-time token response
  /identity/management/clients/{id}/tokens/{tokenId}:
    delete:
      tags: [IAM administration]
      summary: Revoke a client token
      operationId: revokeIamClientToken
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked
  /identity/management/clients/{id}/keys:
    post:
      tags: [IAM administration]
      summary: Add a JWT Profile public key
      operationId: addIamClientKey
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Added key
  /identity/management/clients/{id}/keys/{keyId}:
    delete:
      tags: [IAM administration]
      summary: Revoke a JWT Profile public key
      operationId: revokeIamClientKey
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked
  /identity/management/users:
    get:
      tags: [IAM administration]
      summary: List bundled-IAM users
      operationId: listIamUsers
      responses:
        "200":
          description: Users
    post:
      tags: [IAM administration]
      summary: Create a bundled-IAM user
      operationId: createIamUser
      responses:
        "200":
          description: Created user
  /identity/management/users/{id}:
    put:
      tags: [IAM administration]
      summary: Update a bundled-IAM user
      operationId: updateIamUser
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Updated user
    delete:
      tags: [IAM administration]
      summary: Delete a bundled-IAM user
      operationId: deleteIamUser
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Deleted
  /identity/management/users/{id}/terminate:
    post:
      tags: [IAM administration]
      summary: Terminate a bundled-IAM user
      operationId: terminateIamUser
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Terminated
  /identity/management/users/{id}/reactivate:
    post:
      tags: [IAM administration]
      summary: Reactivate a bundled-IAM user
      operationId: reactivateIamUser
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Reactivated
  /identity/management/roles:
    get:
      tags: [IAM administration]
      summary: List bundled-IAM roles
      operationId: listIamRoles
      responses:
        "200":
          description: Roles
    post:
      tags: [IAM administration]
      summary: Create a custom bundled-IAM role

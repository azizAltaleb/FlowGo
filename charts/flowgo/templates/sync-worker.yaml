{{- if .Values.syncWorker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flowgo.syncWorkerServiceName" . }}
  labels:
    {{- include "flowgo.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync-worker
spec:
  type: {{ .Values.syncWorker.service.type }}
  ports:
    - name: http
      port: {{ .Values.syncWorker.service.port }}
      targetPort: http
  selector:
    {{- include "flowgo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: sync-worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowgo.fullname" . }}-sync-worker
  labels:
    {{- include "flowgo.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync-worker
spec:
  replicas: {{ .Values.replicaCount.syncWorker }}
  selector:
    matchLabels:
      {{- include "flowgo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sync-worker
  template:
    metadata:
      labels:
        {{- include "flowgo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sync-worker
      {{- with .Values.global.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "flowgo.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sync-worker
          image: "{{ .Values.images.syncWorker.repository }}:{{ .Values.images.syncWorker.tag }}"
          imagePullPolicy: {{ .Values.images.syncWorker.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.syncWorker.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "flowgo.envConfigName" . }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.syncWorker.resources | nindent 12 }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

schema_version: "1.0"
scenarios:
  - id: parser-element-type-matrix
    name: Parser maps supported BPMN element types
    category: parser
    support_status: supported
    required: true
    command: go test ./backend/services/workflow-command/internal/domain/bpmn -run TestParse_ElementTypeMatrix -count=1 -v
    elements: startEvent,endEvent,serviceTask,userTask,scriptTask,receiveTask,manualTask,businessRuleTask,callActivity,subProcess,exclusiveGateway,parallelGateway,inclusiveGateway,eventBasedGateway,boundaryEvent,intermediateCatchEvent,intermediateThrowEvent
    behavior: Parse BPMN XML into ArtificialFlow step definitions with expected step types.

  - id: parser-extension-properties
    name: Parser maps legacy ArtificialFlow extension properties and aliases
    category: parser
    support_status: supported
    required: true
    command: go test ./backend/services/workflow-command/internal/domain/bpmn -run 'TestParse_(MapsExtendedElementsAndProperties|MapsPlainAttributeAliasesForCompatibility|MergesExtensionPropertiesWithoutOverridingMappedKeys|CanonicalizesExtensionPropertyAliases)' -count=1 -v
    elements: extensionElements,serviceTask,userTask,sequenceFlow
    behavior: Preserve legacy ArtificialFlow extension properties, plain aliases, and canonical names.

  - id: parser-gateway-joins
    name: Parser populates gateway incoming edges
    category: parser
    support_status: supported
    required: true
    command: go test ./backend/services/workflow-command/internal/domain/bpmn -run TestParse_PopulatesIncomingForGatewayJoin -count=1 -v
    elements: parallelGateway,inclusiveGateway,sequenceFlow
    behavior: Join gateways retain incoming edge metadata needed by runtime navigation.

  - id: xml-call-activity-business-rule-manual
    name: XML runtime covers call activity, business rule, and manual tasks
    category: runtime_xml
    support_status: supported
    required: true
    command: go test ./backend/services/workflow-command/tests -run TestDeployWorkflowFromBPMN_CallActivityBusinessRuleAndManualTask -count=1 -v
    elements: callActivity,businessRuleTask,manualTask
    behavior: Deploy BPMN XML and execute supported auto/runtime elements.

  - id: xml-event-based-gateway
    name: XML runtime covers event-based gateway receive and timer branches
    category: runtime_xml
    support_status: supported
    required: true
    command: go test ./backend/services/workflow-command/tests -run TestDeployWorkflowFromBPMN_EventBasedGatewayReceiveAndTimer -count=1 -v
    elements: eventBasedGateway,receiveTask,timerEventDefinition
    behavior: Event-based gateway waits for a receive/message path or timer branch.

  - id: xml-boundary-timer
    name: XML runtime covers interrupting and non-interrupting boundary timers
    category: runtime_xml
    support_status: supported
    required: true
    command: go test ./backend/services/workflow-command/tests -run 'TestDeployWorkflowFromBPMN_(BoundaryTimerInterruptsTask|BoundaryTimerNonInterruptingKeepsTaskActive)' -count=1 -v
    elements: boundaryEvent,timerEventDefinition,userTask
    behavior: Boundary timers create timer behavior and honor cancelActivity.

  - id: xml-message-signal-throw-catch
    name: XML runtime covers message and signal throw/catch behavior
    category: runtime_xml
    support_status: supported
    required: true
    command: go test ./backend/services/workflow-command/tests -run 'TestDeployWorkflowFromBPMN_(ThrowSignalTriggersCatch|ThrowMessageUsesCorrelationKey|ThrowMessageUsesPlainCorrelationKeyAlias)' -count=1 -v
    elements: intermediateThrowEvent,intermediateCatchEvent,messageEventDefinition,signalEventDefinition
    behavior: Throw events correlate to catch subscriptions through message/signal semantics.

  - id: xml-service-user-assignment
    name: XML runtime covers service task implementation and user assignment mapping
    category: runtime_xml
    support_status: supported
    required: true
    command: go test ./backend/services/workflow-command/tests -run 'TestDeployWorkflowFromBPMN_(ServiceTaskPlainTaskTypeAliasMapsImplementation|ServiceTaskExtensionPropertyMapsImplementation|UserTaskAssignmentFromExtensionProperties)' -count=1 -v
    elements: serviceTask,userTask,extensionElements
    behavior: Service task implementation and user assignment metadata are mapped and executed.

  - id: xml-send-task
    name: XML runtime covers send task as external connector job
    category: runtime_xml
    support_status: supported
    required: true
    command: go test ./backend/services/workflow-command/internal/domain/bpmn ./backend/services/workflow-command/tests -run 'Test(Parse|DeployWorkflowFromBPMN)_SupportsSendTask' -count=1 -v
    elements: sendTask
    behavior: Send tasks map to external jobs with default connector type.

  - id: unsupported-element-reference
    name: Parser rejects unsupported element references
    category: negative
    support_status: unsupported
    required: true
    command: go test ./backend/services/workflow-command/internal/domain/bpmn ./backend/services/workflow-command/tests -run 'Test(Parse|DeployWorkflowFromBPMN)_FailsForUnsupportedElementReferences' -count=1 -v
    elements: adHocSubProcess,complexGateway
    behavior: Unsupported BPMN references fail clearly rather than silently deploying.

  - id: xml-multi-instance
    name: XML multi-instance parsing and execution
    category: runtime_xml
    support_status: supported
    required: true
    command: go test ./backend/services/workflow-command/internal/domain/bpmn ./backend/services/workflow-command/tests -run 'Test(Parse|DeployWorkflowFromBPMN)_MultiInstance' -count=1 -v
    elements: multiInstanceLoopCharacteristics,userTask,serviceTask
    behavior: Parallel and sequential multi-instance from BPMN XML.

  - id: xml-boundary-error-compensation
    name: XML boundary error and compensation execution
    category: runtime_xml
    support_status: supported
    required: true
    command: go test ./backend/services/workflow-command/tests -run 'TestDeployWorkflowFromBPMN_(CompensationFromXML|BoundaryErrorFromXML)' -count=1 -v
    elements: boundaryEvent,errorEventDefinition,compensateEventDefinition
    behavior: Error boundary and compensation handlers execute from deployed XML.

  - id: xml-start-event-variants
    name: XML message, signal, and timer start events
    category: runtime_xml
    support_status: supported
    required: true
    command: go test ./backend/services/workflow-command/tests -run 'TestDeployWorkflowFromBPMN_(MessageStart|TimerStart|TimerStartDate|SignalStart)' -count=1 -v
    elements: startEvent,messageEventDefinition,signalEventDefinition,timerEventDefinition
    behavior: Typed start-event semantics start matching process definitions.

  - id: xml-gateway-defaults-and-joins
    name: XML gateway defaults and multi-path joins
    category: runtime_xml
    support_status: supported
    required: true
    command: go test ./backend/services/workflow-command/tests -run 'TestDeployWorkflowFromBPMN_(ExclusiveDefault|ParallelJoin|InclusiveJoin)' -count=1 -v
    elements: exclusiveGateway,inclusiveGateway,parallelGateway,sequenceFlow
    behavior: XML runtime defaults and joins assert token routing.

  - id: xml-signal-boundary-esp
    name: XML signal/message boundary and event sub-process
    category: runtime_xml
    support_status: supported
    required: true
    command: go test ./backend/services/workflow-command/tests -run 'TestDeployWorkflowFromBPMN_(SignalBoundary|MessageBoundary|EventSubProcessSignal)' -count=1 -v
    elements: boundaryEvent,signalEventDefinition,messageEventDefinition,eventSubProcess
    behavior: PublishSignal/PublishMessage interrupts/spawns boundary and event sub-process paths.

  - id: xml-escalation-boundary
    name: XML escalation boundary execution
    category: runtime_xml
    support_status: supported
    required: true
    command: go test ./backend/services/workflow-command/tests -run TestDeployWorkflowFromBPMN_EscalationBoundary -count=1 -v
    elements: boundaryEvent,escalationEventDefinition
    behavior: Escalation boundary triggers from throw/publish.

  - id: xml-link-terminate
    name: XML link catch/throw and terminate end
    category: runtime_xml
    support_status: supported
    required: true
    command: go test ./backend/services/workflow-command/tests -run TestDeployWorkflowFromBPMN_LinkAndTerminate -count=1 -v
    elements: linkEventDefinition,terminateEventDefinition
    behavior: Link jumps and terminate cancels sibling tokens.

  - id: xml-conditional-catch
    name: XML conditional catch execution
    category: runtime_xml
    support_status: supported
    required: true
    command: go test ./backend/services/workflow-command/tests -run TestDeployWorkflowFromBPMN_ConditionalCatch -count=1 -v
    elements: conditionalEventDefinition,intermediateCatchEvent
    behavior: Conditional catch waits until expression is true.

  - id: xml-transaction-cancel
    name: XML transaction cancel boundary
    category: runtime_xml
    support_status: supported
    required: true
    command: go test ./backend/services/workflow-command/tests -run TestDeployWorkflowFromBPMN_TransactionCancel -count=1 -v
    elements: transaction,cancelEventDefinition
    behavior: Cancel end triggers cancel boundary on transaction.

  - id: xml-event-subprocess
    name: XML event sub-process message/timer
    category: runtime_xml
    support_status: supported
    required: true
    command: go test ./backend/services/workflow-command/tests -run 'TestDeployWorkflowFromBPMN_EventSubProcess(Message|Timer)' -count=1 -v
    elements: eventSubProcess,messageEventDefinition,timerEventDefinition
    behavior: Event sub-processes start for matching message/timer.

  - id: xml-visual-roundtrip
    name: Visual collaboration shapes round-trip in modeler XML
    category: visual
    support_status: visual-only
    required: false
    command: cd frontend && npm test -- --run src/lib/bpmn-parser.test.ts
    elements: participant,lane,dataObject,dataStoreReference,textAnnotation
    behavior: Visual shapes import/export without becoming executable tokens.

  - id: connector-http-contract
    name: HTTP connector contract and allowlist hardening
    category: connectors
    support_status: supported
    required: true
    command: go test ./connectors/http ./connectors/internal/common -count=1 -v
    elements: http
    behavior: HTTP connector validates inputs, allowlist, and output variables.

name: Feature request
description: Suggest an improvement for ArtificialFlow
title: "[Feature]: "
labels:
  - kind/feature
  - status/needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow, operator, SDK, or deployment problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the desired behavior or API.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - BPMN/runtime
        - Worker API
        - Node.js SDK
        - Frontend/modeler
        - IAM/security
        - Docker/Helm/deployment
        - Documentation
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What should be true when this is complete?
      placeholder: |
        - ...
        - ...
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Note any expected effect on worker API, SDK API, Docker env vars, Helm values, IAM roles/claims, BPMN semantics, or existing workflows.
  - type: textarea
    id: qa
    attributes:
      label: Suggested validation
      description: Mention tests, smoke checks, or manual QA that would prove the feature works.

{{- if .Values.autoscaling.enabled }}
{{- if .Values.autoscaling.command.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "artificialflow.fullname" . }}-command
  labels:
    {{- include "artificialflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: command
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "artificialflow.fullname" . }}-command
  minReplicas: {{ .Values.autoscaling.command.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.command.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.command.targetCPUUtilizationPercentage }}
{{- end }}

    build: !reset null

  workflow-runtime:
    image: ${ARTIFICIALFLOW_IMAGE_REGISTRY:-${FLOWGO_IMAGE_REGISTRY:-artificialflow}}/workflow-runtime:${ARTIFICIALFLOW_IMAGE_TAG:-${FLOWGO_IMAGE_TAG:-0.3.0}}

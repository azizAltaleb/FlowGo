components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WorkflowId:
      name: id
      in: path
      required: true
      description: Numeric definition key or BPMN process id
      schema:
        type: string
    InstanceId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        type: string
    JobKey:
      name: key
      in: path
      required: true
      schema:
        type: string
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 100
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
    IncludeCompleted:
      name: includeCompleted
      in: query
      schema:
        type: boolean
        default: false
    WorkerProtocol:
      name: X-Workflow-Worker-Protocol-Version
      in: header
      required: true
      schema:
        type: string
        enum: [v1]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    ActingSubject:
      name: X-ArtificialFlow-Acting-Subject
      in: header
      schema:
        type: string
    ActingUsername:
      name: X-ArtificialFlow-Acting-Username
      in: header
      schema:
        type: string
    ActingEmail:
      name: X-ArtificialFlow-Acting-Email
      in: header
      schema:
        type: string
        format: email
    ActingName:
      name: X-ArtificialFlow-Acting-Name
      in: header
      schema:
        type: string
    ActingRoles:
      name: X-ArtificialFlow-Acting-Roles
      in: header
      schema:
        type: string
      description: Comma-separated candidate-group roles
  responses:
    BadRequest:
      description: Invalid request
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorText"
    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorText"
    Forbidden:
      description: Principal does not have the required role or acting-user scope
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorText"
    NotFound:
      description: Resource not found
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorText"
    Conflict:
      description: Resource state or ownership conflict
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorText"
  schemas:
